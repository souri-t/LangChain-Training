version: '3.8'

services:
  # Ollama サービス（埋め込みモデルエンジン）
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # FastAPI WebAPI サーバー
  api:
    build:
      context: .
      dockerfile: rag_api/Dockerfile
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/rag_chroma_app/config.yaml
    volumes:
      - ./:/app
    networks:
      - rag_network
    depends_on:
      ollama:
        condition: service_healthy
    command: python3 -m uvicorn api_server:app --host 0.0.0.0 --port 8000 --reload

  # Streamlit UI アプリ
  streamlit:
    build:
      context: .
      dockerfile: rag_chroma_app/Dockerfile
    container_name: rag_streamlit
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/rag_chroma_app/config.yaml
      - API_URL=http://api:8000
    volumes:
      - ./:/app
      - streamlit_cache:/root/.streamlit
    depends_on:
      - api
    networks:
      - rag_network
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501

networks:
  rag_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  streamlit_cache:
    driver: local
